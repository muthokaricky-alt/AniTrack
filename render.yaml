# Render Blueprint: "New +" > "Blueprint" and pick this repo.
services:
  - type: web
    name: anitrack
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the Render dashboard
